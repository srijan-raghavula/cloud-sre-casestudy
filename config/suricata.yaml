# Suricata Configuration
# Reference: Khan (2016) Case Study — Infrastructure Setup

%YAML 1.1
---

# === Variables ===
vars:
  - HOME-NET: "10.0.2.0/24"
  - EXTERNAL-NET: "!$HOME-NET"
  - USER-AGENTS: "|Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)|"

# === Default Logging ===
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            enabled: yes
        - http:
            enabled: yes
            extended: yes
        - dns:
            enabled: yes
        - files:
            enabled: yes
            force-magic: yes
        - smtp:
            enabled: yes
        - ssh:
            enabled: yes
        - flow:
            enabled: yes
            family: inet
            states: [new, established, closed, deleted]
        - tls:
            enabled: yes

# === Logging ===
logging:
  - default-loggers:
      - console
      - file
    default-output-directory: /var/log/suricata
    stats: yes
    filters:
      - console:
          level: warning
      - file:
          level: info

# === Classification Configuration ===
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

# === Rule Files ===
rule-files:
  - suricata_a1.rules
  - suricata_a4.rules

# === Flow Table (sized for flood traffic) ===
flow:
  memcap: 256mb
  hash-size: 65536

# === Stream Reassembly ===
stream:
  memcap: 128mb
  checksum-validation: yes
  track-bytes: yes
  track-sessions: both
  reassembly:
    memcap: 256mb
    depth: 0

defrag:
  memcap: 64mb

# === App Layer Protocol Detection ===
app-layer:
  protocols:
    http:
      enabled: yes
      libhtp:
        default-config:
          personality: IDS
    tls:
      enabled: yes
    dns:
      enabled: yes

# === Detection Engine ===
detect:
  profile: medium
    # Optimized for real-time detection

# === Performance Tuning ===
pf-ring:
  enabled: no

nfq:
  # Inline IPS mode via NFQUEUE
  repeat-set:
    - policy: accept
      queue: 0
    - policy: accept
      queue: 1
  rule-run: 1
  decode-timeout: 1000

# === Host-Based Rules ===
host:
  - 10.0.2.10
  - 10.0.2.20

# === Stream Tracking ===
stream-trackers:
  tcp:
    memcap: 16mb
  udp:
    memcap: 8mb
  icmp:
    memcap: 4mb
