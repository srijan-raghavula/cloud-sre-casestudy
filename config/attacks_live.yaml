# Live Attack Configuration — targets the Docker VPC via published ports.
# Used by `make run-everything`: web-server is reachable at 127.0.0.1:80
# and db-server at 127.0.0.1:5432 from the host.
# Vectors needing raw sockets (nmap SYN, hping3) degrade gracefully when
# the tools are absent — the orchestrator logs and continues.

attacks:
  - name: port_scan_syn
    category: A1a
    tool: nmap
    target: 127.0.0.1
    command: nmap
    args: ["-sS", "-T4"]
    ports: "80,443,5432"
    rate: 100
    duration: 30
    enabled: true

  - name: http_flood_syn
    category: A1
    tool: hping3
    target: 127.0.0.1
    command: hping3
    args: []
    rate: 1000
    duration: 30
    enabled: true

  - name: http_get_flood
    category: A1
    tool: python
    target: 127.0.0.1
    command: python3
    args: []
    rate: 20
    duration: 30
    enabled: true

  - name: resource_abuse_cpu
    category: A2d
    tool: stress-ng
    target: 127.0.0.1
    command: stress-ng
    args: []
    rate: 2
    duration: 30
    enabled: true

  - name: sqli_union_select
    category: A4c
    tool: sqlmap
    target: 127.0.0.1
    command: python3
    args: ["sqli", "/vulnerable"]
    duration: 30
    enabled: true

  - name: sqli_or_1_equals_1
    category: A4c
    tool: sqlmap
    target: 127.0.0.1
    command: python3
    args: ["sqli", "/vulnerable"]
    duration: 30
    enabled: true

  - name: xss_script_injection
    category: A4c
    tool: curl
    target: 127.0.0.1
    command: python3
    args: ["xss", "/search"]
    duration: 30
    enabled: true
